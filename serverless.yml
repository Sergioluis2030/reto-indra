service: rimac-appointment-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30
  architecture: arm64
  environment:
    STAGE: ${self:provider.stage}
    APPOINTMENTS_TABLE: ${self:custom.appointmentsTable}
    APPOINTMENT_TOPIC_ARN:
      Ref: AppointmentTopic
    EVENT_BUS_NAME: ${self:custom.eventBusName}
    CONFIRMATION_QUEUE_URL:
      Ref: ConfirmationQueue
    # RDS - reemplazar con valores reales o usar SSM/Secrets Manager en producción
    RDS_HOST: ${env:RDS_HOST, 'localhost'}
    RDS_PORT: ${env:RDS_PORT, '3306'}
    RDS_USER: ${env:RDS_USER, 'admin'}
    RDS_PASSWORD: ${env:RDS_PASSWORD, 'password'}
    RDS_DATABASE: ${env:RDS_DATABASE, 'appointments'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt AppointmentsTable.Arn
            - !Sub '${AppointmentsTable.Arn}/index/*'
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - !Ref AppointmentTopic
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:SendMessage
          Resource:
            - !GetAtt SqsPe.Arn
            - !GetAtt SqsCl.Arn
            - !GetAtt ConfirmationQueue.Arn
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - !GetAtt AppointmentEventBus.Arn
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  appointmentsTable: rimac-appointments-${self:provider.stage}
  eventBusName: rimac-appointment-bus-${self:provider.stage}
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

functions:
  # Lambda principal: API Gateway (POST + GET) + consumidor de cola de confirmación
  appointment:
    handler: src/interfaces/http/appointmentHandler.handler
    description: Crea y consulta citas + actualiza estado a completed
    events:
      - http:
          path: appointments
          method: post
          cors: true
      - http:
          path: appointments/{insuredId}
          method: get
          cors: true
          request:
            parameters:
              paths:
                insuredId: true
      - sqs:
          arn: !GetAtt ConfirmationQueue.Arn
          batchSize: 5

  # Procesador país PE
  appointment_pe:
    handler: src/interfaces/events/countryProcessor.handler
    description: Procesa citas de Perú - guarda en RDS PE y emite evento de confirmación
    environment:
      COUNTRY_ISO: PE
    events:
      - sqs:
          arn: !GetAtt SqsPe.Arn
          batchSize: 5

  # Procesador país CL
  appointment_cl:
    handler: src/interfaces/events/countryProcessor.handler
    description: Procesa citas de Chile - guarda en RDS CL y emite evento de confirmación
    environment:
      COUNTRY_ISO: CL
    events:
      - sqs:
          arn: !GetAtt SqsCl.Arn
          batchSize: 5

resources:
  Resources:
    # ========== DynamoDB ==========
    AppointmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.appointmentsTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: insuredId
            AttributeType: S
          - AttributeName: appointmentId
            AttributeType: S
        KeySchema:
          - AttributeName: insuredId
            KeyType: HASH
          - AttributeName: appointmentId
            KeyType: RANGE
        Tags:
          - Key: Project
            Value: rimac-appointment
          - Key: Stage
            Value: ${self:provider.stage}

    # ========== SNS Topic ==========
    AppointmentTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: rimac-appointment-topic-${self:provider.stage}
        DisplayName: Rimac Appointment Topic

    # ========== SQS Perú ==========
    SqsPe:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-sqs-pe-${self:provider.stage}
        VisibilityTimeout: 60
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SqsPeDlq.Arn
          maxReceiveCount: 3

    SqsPeDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-sqs-pe-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    # ========== SQS Chile ==========
    SqsCl:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-sqs-cl-${self:provider.stage}
        VisibilityTimeout: 60
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SqsClDlq.Arn
          maxReceiveCount: 3

    SqsClDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-sqs-cl-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    # ========== SQS Confirmación ==========
    ConfirmationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-confirmation-queue-${self:provider.stage}
        VisibilityTimeout: 60
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ConfirmationQueueDlq.Arn
          maxReceiveCount: 3

    ConfirmationQueueDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rimac-confirmation-queue-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    # ========== SNS Subscriptions con Filter Policy ==========
    SnsSubscriptionPe:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        TopicArn: !Ref AppointmentTopic
        Endpoint: !GetAtt SqsPe.Arn
        FilterPolicy:
          countryISO:
            - PE
        RawMessageDelivery: true

    SnsSubscriptionCl:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        TopicArn: !Ref AppointmentTopic
        Endpoint: !GetAtt SqsCl.Arn
        FilterPolicy:
          countryISO:
            - CL
        RawMessageDelivery: true

    # Permisos SNS → SQS
    SqsPePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SqsPe
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt SqsPe.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref AppointmentTopic

    SqsClPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref SqsCl
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt SqsCl.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref AppointmentTopic

    # ========== EventBridge ==========
    AppointmentEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.eventBusName}

    AppointmentCompletedRule:
      Type: AWS::Events::Rule
      Properties:
        Name: rimac-appointment-completed-${self:provider.stage}
        Description: Envía confirmación de cita completada a la cola de confirmación
        EventBusName: !Ref AppointmentEventBus
        EventPattern:
          source:
            - rimac.appointment
          detail-type:
            - AppointmentCompleted
        State: ENABLED
        Targets:
          - Id: ConfirmationQueueTarget
            Arn: !GetAtt ConfirmationQueue.Arn

    # Permiso EventBridge → SQS Confirmation
    ConfirmationQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ConfirmationQueue
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ConfirmationQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt AppointmentCompletedRule.Arn

  Outputs:
    ApiGatewayUrl:
      Description: URL base del API Gateway
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: ApiGatewayRestApi
            - '.execute-api.'
            - ${self:provider.region}
            - '.amazonaws.com/'
            - ${self:provider.stage}
    AppointmentsTableName:
      Value: !Ref AppointmentsTable
    AppointmentTopicArn:
      Value: !Ref AppointmentTopic
    EventBusName:
      Value: !Ref AppointmentEventBus
